name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create this tag (e.g. v1.0.0) on the selected commit and publish a Release. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Determine version
        id: ver
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            v="${RELEASE_TAG#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=$(sed -n 's/^local PLUGIN_VERSION = "\(.*\)"/\1/p' echonet_lite.lua)
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build installer
        run: |
          mkdir -p dist
          makensis -V2 -DVERSION=${{ steps.ver.outputs.version }} installer/echonet_lite_installer.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: echonet-lite-wireshark-setup-${{ steps.ver.outputs.version }}
          path: dist/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release already exists (e.g. created from the GitHub UI): just attach the files
            gh release upload "$TAG" dist/*.exe echonet_lite.lua --clobber
          else
            gh release create "$TAG" dist/*.exe echonet_lite.lua \
              --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
