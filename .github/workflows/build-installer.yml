name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Determine version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=$(sed -n 's/^local PLUGIN_VERSION = "\(.*\)"/\1/p' echonet_lite.lua)
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build installer
        run: |
          mkdir -p dist
          makensis -V2 -DVERSION=${{ steps.ver.outputs.version }} installer/echonet_lite_installer.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: echonet-lite-wireshark-setup-${{ steps.ver.outputs.version }}
          path: dist/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.exe echonet_lite.lua \
            --title "$GITHUB_REF_NAME" --generate-notes
